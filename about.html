  <h1 class="profile-name">太尾田尚希　TAODA NAOKI</h1>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // --- スクロール検知 ---
  const scrollBtn = document.getElementById('scrollToTop');
  window.addEventListener('scroll', () => {
    if(scrollBtn) scrollBtn.style.display = (window.scrollY > 200) ? 'block' : 'none';
  });
  if(scrollBtn){
    scrollBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // --- ハンバーガー ---
  const hamburger = document.getElementById('hamburger');
  const mobileNav = document.getElementById('mobile-nav');
  if(hamburger && mobileNav){
    mobileNav.style.display = 'none';
    hamburger.addEventListener('click', () => {
      mobileNav.style.display = (mobileNav.style.display==='none'||mobileNav.style.display==='') ? 'flex' : 'none';
    });
  }

  // --- 現在ページのリンクハイライト ---
  const currentPage = location.pathname.split("/").pop();
  document.querySelectorAll('.main-nav a').forEach(link => {
    if(link.getAttribute('href') === currentPage){
      link.classList.add('active');
    }
  });

  // --- 曇りガラス ---
  const canvas = document.getElementById("fog-canvas");
  const img = document.querySelector(".about-img");
  if(canvas && img){
    const ctx = canvas.getContext("2d");
    let drawing = false;

    function setupFog(){
      const rect = img.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(ratio, ratio);

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fillRect(0,0,rect.width,rect.height);
    }

    setupFog();
    window.addEventListener("resize", setupFog);

    function erase(x,y){
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x,y,40,0,Math.PI*2);
      ctx.fill();
    }

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      if(e.touches) return { x: e.touches[0].clientX-rect.left, y: e.touches[0].clientY-rect.top };
      return { x: e.clientX-rect.left, y: e.clientY-rect.top };
    }

    // --- PC ---
    canvas.addEventListener("mousedown", e => { drawing=true; erase(getPos(e).x,getPos(e).y); });
    canvas.addEventListener("mousemove", e => { if(drawing) erase(getPos(e).x,getPos(e).y); });
    canvas.addEventListener("mouseup", ()=>drawing=false);
    canvas.addEventListener("mouseleave", ()=>drawing=false);

    // --- スマホ ---
    canvas.addEventListener("touchstart", e => { e.preventDefault(); drawing=true; erase(getPos(e).x,getPos(e).y); }, {passive:false});
    canvas.addEventListener("touchmove", e => { e.preventDefault(); if(drawing) erase(getPos(e).x,getPos(e).y); }, {passive:false});
    canvas.addEventListener("touchend", ()=>drawing=false);
    canvas.addEventListener("touchcancel", ()=>drawing=false);
  }

});


document.addEventListener("DOMContentLoaded", () => {

  const canvas = document.getElementById("fog-canvas");
  const img = document.querySelector(".about-img");
  if(!canvas || !img) return;

  const ctx = canvas.getContext("2d");
  let drawing = false;

  // 高 DPI 対応 & サイズ設定
  function setupFog(){
    const rect = img.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(ratio, ratio);

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillRect(0,0,rect.width,rect.height);
  }

  setupFog();
  window.addEventListener("resize", setupFog);

  // 消す処理
  function erase(x,y){
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x,y,40,0,Math.PI*2);
    ctx.fill();
  }

  // 座標取得（PC/タッチ共通）
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    if(e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // --- PC ---
  canvas.addEventListener("mousedown", e => { drawing=true; erase(getPos(e).x,getPos(e).y); });
  canvas.addEventListener("mousemove", e => { if(drawing) erase(getPos(e).x,getPos(e).y); });
  canvas.addEventListener("mouseup", ()=>drawing=false);
  canvas.addEventListener("mouseleave", ()=>drawing=false);

  // --- スマホ ---
  canvas.addEventListener("touchstart", e => { 
    e.preventDefault(); 
    drawing=true; 
    erase(getPos(e).x,getPos(e).y); // ←ここが重要
  }, {passive:false});

  canvas.addEventListener("touchmove", e => { 
    e.preventDefault(); 
    if(drawing) erase(getPos(e).x,getPos(e).y); 
  }, {passive:false});

  canvas.addEventListener("touchend", ()=>drawing=false);
  canvas.addEventListener("touchcancel", ()=>drawing=false);

});
</script>
